# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = eDP-1,1920x1080@120.21,0x0,1
monitor = HDMI-A-1,1920x1080@100,1920x0,1
#monitor=eDP-1,preferred,auto,1
#monitor=DP-3,1920x1080@74.97,0x0,1

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus

# Environment (these only apply inside Hyprland, GNOME is not affected)
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,phinger-cursors-light
env = HYPRCURSOR_THEME,phinger-cursors-light
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Autostart
# Portals are DBus-activated on Arch (config: /usr/share/xdg-desktop-portal/hyprland-portals.conf)
# Kill any stale hypridle left over from a previous login first, it blocks the
# ScreenSaver D-Bus name (breaks idle inhibit and hangs xdg-desktop-portal-gtk)
exec-once = pkill -KILL -x hypridle; hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets
# Quickshell: bar, launcher, panels and the wallpaper (WallpaperBackground.qml)
exec-once = ~/.config/hypr/quickshell.sh
# Clipboard history (cliphist), shown with SUPER+V
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true
    scroll_points =
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0  # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 1
    gaps_out = 3
    border_size = 3
    col.active_border = rgba(121212ee)
    col.inactive_border = rgba(1E1E1Eaa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # speed is in deciseconds (1 = 100ms). Lower = snappier.
    animation = windows, 1, 4, default,popin 10%
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 4, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    preserve_split = yes
}

# Touchpad: 3-finger swipe left/right switches workspace
gesture = 3, horizontal, workspace

render {
    direct_scanout = 2 # fullscreen games skip compositing (less latency, less GPU work)
    cm_enabled = false # no HDR screens here, skip the color-management pass
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(121213) # matches Quickshell, shown before the wallpaper loads
}

# See https://wiki.hyprland.org/Configuring/Window-Rules/

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, X, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exec, hyprctl dispatch exit
bind = $mainMod SHIFT, R, exec,  ~/.config/hypr/refresh.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, SPACE, togglefloating,
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit,
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/swap the active window with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize the active window with mainMod + CTRL + arrow keys (hold to repeat)
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces with mainMod + Numpad keys (NumLock On & Off)
bind = $mainMod, KP_1, workspace, 1
bind = $mainMod, KP_End, workspace, 1
bind = $mainMod, KP_2, workspace, 2
bind = $mainMod, KP_Down, workspace, 2
bind = $mainMod, KP_3, workspace, 3
bind = $mainMod, KP_Next, workspace, 3
bind = $mainMod, KP_4, workspace, 4
bind = $mainMod, KP_Left, workspace, 4
bind = $mainMod, KP_5, workspace, 5
bind = $mainMod, KP_Begin, workspace, 5
bind = $mainMod, KP_6, workspace, 6
bind = $mainMod, KP_Right, workspace, 6
bind = $mainMod, KP_7, workspace, 7
bind = $mainMod, KP_Home, workspace, 7
bind = $mainMod, KP_8, workspace, 8
bind = $mainMod, KP_Up, workspace, 8
bind = $mainMod, KP_9, workspace, 9
bind = $mainMod, KP_Prior, workspace, 9
bind = $mainMod, KP_0, workspace, 10
bind = $mainMod, KP_Insert, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to workspace with mainMod + SHIFT + Numpad keys
bind = $mainMod SHIFT, KP_1, movetoworkspace, 1
bind = $mainMod SHIFT, KP_End, movetoworkspace, 1
bind = $mainMod SHIFT, KP_2, movetoworkspace, 2
bind = $mainMod SHIFT, KP_Down, movetoworkspace, 2
bind = $mainMod SHIFT, KP_3, movetoworkspace, 3
bind = $mainMod SHIFT, KP_Next, movetoworkspace, 3
bind = $mainMod SHIFT, KP_4, movetoworkspace, 4
bind = $mainMod SHIFT, KP_Left, movetoworkspace, 4
bind = $mainMod SHIFT, KP_5, movetoworkspace, 5
bind = $mainMod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mainMod SHIFT, KP_6, movetoworkspace, 6
bind = $mainMod SHIFT, KP_Right, movetoworkspace, 6
bind = $mainMod SHIFT, KP_7, movetoworkspace, 7
bind = $mainMod SHIFT, KP_Home, movetoworkspace, 7
bind = $mainMod SHIFT, KP_8, movetoworkspace, 8
bind = $mainMod SHIFT, KP_Up, movetoworkspace, 8
bind = $mainMod SHIFT, KP_9, movetoworkspace, 9
bind = $mainMod SHIFT, KP_Prior, movetoworkspace, 9
bind = $mainMod SHIFT, KP_0, movetoworkspace, 10
bind = $mainMod SHIFT, KP_Insert, movetoworkspace, 10

bind = ALT SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Scroll through workspaces on the current monitor with mainMod + scroll
# (r = stay on this monitor, includes empty ones; e+1 used to jump to the other screen)
bind = $mainMod, mouse_down, workspace, r+1
bind = $mainMod, mouse_up, workspace, r-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
#CUSTOM BINDINGS
bind = $mainMod,B,exec,brave
bind = $mainMod,C,exec,google-chrome-stable
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+ && qs ipc call osd brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- && qs ipc call osd brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# App launcher
bind = $mainMod,D,global,quickshell:launcher
# Fallback IPC trigger if ever needed: bind = $mainMod,D,exec,qs ipc call launcher toggle
# Clipboard history
bind = $mainMod,V,global,quickshell:clipboard
bind = $mainMod,A,exec,qs ipc call control toggle
bind = $mainMod,I,exec,qs ipc call control openSettings
bind = $mainMod,L,exec,hyprlock
bind = $mainMod, escape, exec, qs ipc call power toggle
bind = $mainMod, W, exec, qs ipc call wallpaper toggle
# Screenshots (saved to ~/Pictures/Screenshots + copied to clipboard)
bind = $mainMod, S, exec, ~/.config/hypr/screenshot.sh
bind = $mainMod, Print, exec, ~/.config/hypr/screenshot.sh screen


# Cursor submap (similar to the Mouse mode in Sway)
submap=cursor

# Jump cursor to a position
bind=,a,exec,hyprctl dispatch submap reset && wl-kbptr && hyprctl dispatch submap cursor

# Cursor movement
binde=,j,exec,wlrctl pointer move 0 10
binde=,k,exec,wlrctl pointer move 0 -10
binde=,l,exec,wlrctl pointer move 10 0
binde=,h,exec,wlrctl pointer move -10 0

# Left button
bind=,q,exec,wlrctl pointer click left
# Middle button
bind=,w,exec,wlrctl pointer click middle
# Right button
bind=,e,exec,wlrctl pointer click right

# Scroll up and down
binde=,f,exec,wlrctl pointer scroll 10 0
binde=,r,exec,wlrctl pointer scroll -10 0

# Scroll left and right
binde=,t,exec,wlrctl pointer scroll 0 -10
binde=,g,exec,wlrctl pointer scroll 0 10

# Exit cursor submap
# If you do not use cursor timeout or cursor:hide_on_key_press, you can delete its respective cals
bind=,escape,exec,hyprctl keyword cursor:inactive_timeout 3; hyprctl keyword cursor:hide_on_key_press true; hyprctl dispatch submap reset

submap = reset

# Entrypoint (SUPER + SHIFT + C for Cursor mode; SUPER + C is Chrome)
# If you do not use cursor timeout or cursor:hide_on_key_press, you can delete its respective cals
bind = $mainMod SHIFT, C, exec, hyprctl keyword cursor:inactive_timeout 0; hyprctl keyword cursor:hide_on_key_press false; hyprctl dispatch submap cursor
